services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI missing, see .env.example}
      API_TOKEN: ${API_TOKEN:?API_TOKEN missing, see .env.example}
      PORT: 3000
      # Optional: reminders are off without NTFY_URL (ntfy root URL) and NTFY_TOPIC.
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - default
      - proxy

  mcp:
    build: ./mcp
    restart: unless-stopped
    environment:
      API_URL: ${API_URL:?API_URL missing, see .env.example}
      API_TOKEN: ${API_TOKEN:?API_TOKEN missing, see .env.example}
    networks:
      - default
      - proxy

networks:
  proxy:
    external: true

volumes:
  mongo-data:
