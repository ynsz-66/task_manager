$kind: http-request
order: 8100
method: POST
url: '{{mcpUrl}}'
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 27,
      "method": "tools/call",
      "params": {
        "name": "delete_task",
        "arguments": {
          "task_id": "{{taskId1}}"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const result = JSON.parse(pm.variables.get('rpc')).result
      const text = result.content.map((c) => c.text).join('\n')
      pm.test('tool call is an error', () => pm.expect(result.isError).to.eql(true))
      pm.test('error text', () => pm.expect(text).to.include('404 Not Found: task not found'))
