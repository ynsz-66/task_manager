$kind: http-request
order: 3100
method: POST
url: '{{mcpUrl}}'
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 5,
      "method": "tools/call",
      "params": {
        "name": "create_task",
        "arguments": {
          "title": "mcp-task2-{{suffix}}",
          "category": "mcpA-{{suffix}}"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const result = JSON.parse(pm.variables.get('rpc')).result
      const text = result.content.map((c) => c.text).join('\n')
      const task = result.structuredContent
      pm.test('task created in category A', () => {
        pm.expect(result.isError).to.eql(false)
        pm.expect(task.category).to.eql(pm.collectionVariables.get('catAId'))
      })
      pm.collectionVariables.set('taskId2', task.id)
