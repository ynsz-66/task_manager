$kind: http-request
order: 5100
method: POST
url: '{{mcpUrl}}'
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 9,
      "method": "tools/call",
      "params": {
        "name": "update_task",
        "arguments": {
          "task_id": "{{taskId2}}",
          "category": "mcpB-{{suffix}}"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const result = JSON.parse(pm.variables.get('rpc')).result
      const text = result.content.map((c) => c.text).join('\n')
      pm.test('moved to category B', () => {
        pm.expect(result.isError).to.eql(false)
        pm.expect(result.structuredContent.category).to.eql(pm.collectionVariables.get('catBId'))
      })
