$kind: http-request
order: 6900
method: POST
url: '{{mcpUrl}}'
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 23,
      "method": "tools/call",
      "params": {
        "name": "update_category",
        "arguments": {
          "category_id": "{{catAId}}"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const result = JSON.parse(pm.variables.get('rpc')).result
      const text = result.content.map((c) => c.text).join('\n')
      pm.test('tool call is an error', () => pm.expect(result.isError).to.eql(true))
      pm.test('error text', () => pm.expect(text).to.include('400 Bad Request: nothing to update (name, order)'))
