$kind: http-request
order: 6000
method: POST
url: '{{mcpUrl}}'
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 14,
      "method": "tools/call",
      "params": {
        "name": "update_category",
        "arguments": {
          "category_id": "{{catAId}}",
          "name": "mcpR-{{suffix}}"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const result = JSON.parse(pm.variables.get('rpc')).result
      pm.test('category renamed', () => {
        pm.expect(result.isError).to.eql(false)
        pm.expect(result.structuredContent.id).to.eql(pm.collectionVariables.get('catAId'))
        pm.expect(result.structuredContent.name).to.eql(`mcpR-${pm.collectionVariables.get('suffix')}`)
      })
