$kind: http-request
order: 1000
method: POST
url: '{{mcpUrl}}'
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 0,
      "method": "initialize",
      "params": {
        "protocolVersion": "2025-06-18",
        "capabilities": {},
        "clientInfo": {
          "name": "postman",
          "version": "1.0"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 initialized', () => pm.response.to.have.status(200))
      const result = JSON.parse(pm.variables.get('rpc')).result
      pm.test('server is tasks_tools with tools capability', () => {
        pm.expect(result.serverInfo.name).to.eql('tasks_tools')
        pm.expect(result.capabilities).to.have.property('tools')
      })
      const session = pm.response.headers.get('mcp-session-id')
      pm.test('mcp-session-id header returned', () => pm.expect(session).to.be.a('string').and.not.empty)
      pm.collectionVariables.set('mcpSessionId', session)
