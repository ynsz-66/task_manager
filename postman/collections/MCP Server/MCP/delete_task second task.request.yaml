$kind: http-request
order: 8300
method: POST
url: '{{mcpUrl}}'
body:
  type: json
  content: |-
    {
      "jsonrpc": "2.0",
      "id": 29,
      "method": "tools/call",
      "params": {
        "name": "delete_task",
        "arguments": {
          "task_id": "{{taskId2}}"
        }
      }
    }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const result = JSON.parse(pm.variables.get('rpc')).result
      const text = result.content.map((c) => c.text).join('\n')
      pm.test('task deleted', () => pm.expect(result.isError).to.eql(false))
