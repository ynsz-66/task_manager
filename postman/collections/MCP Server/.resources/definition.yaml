$kind: collection
name: MCP Server
description: |-
  Tests every tool of the MCP server (mcp/server.py) over streamable HTTP with raw JSON-RPC:
  initialize, notifications/initialized, tools/list, then tools/call per tool.
  Setup and Cleanup hit the Express API directly (baseUrl + bearer apiToken) and remove every
  category/task created by the run. Run with:
  postman collection run "postman/collections/MCP Server" --env-var "apiToken=..." [--env-var "mcpUrl=..."]
variables:
  - key: baseUrl
    value: 'http://localhost:3000/api'
  - key: mcpUrl
    value: 'http://127.0.0.1:8000/mcp'
  - key: mcpToken
    value: ''
    description: Bearer token for the MCP endpoint (only enforced by Caddy in prod; empty locally)
  - key: unknownId
    value: '000000000000000000000000'
    description: Valid ObjectId that matches no document
auth:
  type: bearer
  credentials:
    - key: token
      value: '{{apiToken}}'
scripts:
  - type: http:afterResponse
    language: text/javascript
    code: |-
      // Every Express API error response must carry a JSON { error: string }.
      if (pm.response.code >= 400) {
        pm.test('error body has an error message', () => {
          pm.expect(pm.response.json().error).to.be.a('string').and.not.empty
        })
      }
