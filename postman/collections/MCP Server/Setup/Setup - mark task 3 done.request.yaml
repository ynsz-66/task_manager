$kind: http-request
order: 3400
method: PATCH
url: '{{baseUrl}}/tasks/{{catTaskId3}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "done": true }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 task 3 done', () => {
        pm.response.to.have.status(200)
        pm.expect(pm.response.json().done).to.eql(true)
      })
