$kind: http-request
order: 3000
method: POST
url: '{{baseUrl}}/tasks'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "title": "mcp-cat-task1-{{suffix}}", "category": "{{catBId}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 task created', () => pm.response.to.have.status(200))
      pm.collectionVariables.set('catTaskId1', pm.response.json().id)
