$kind: http-request
order: 2000
method: POST
url: '{{baseUrl}}/categories'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "name": "mcpB-{{suffix}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 category created', () => pm.response.to.have.status(200))
      pm.collectionVariables.set('catBId', pm.response.json().id)
