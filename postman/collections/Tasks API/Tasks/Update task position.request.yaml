$kind: http-request
order: 4700
method: PATCH
url: '{{baseUrl}}/tasks/{{taskId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "position": 0 }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 moved first among its siblings', () => {
        pm.response.to.have.status(200)
        pm.expect(pm.response.json().position).to.eql(0)
      })
