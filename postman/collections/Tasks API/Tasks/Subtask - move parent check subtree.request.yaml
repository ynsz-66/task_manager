$kind: http-request
order: 7450
method: GET
url: '{{baseUrl}}/tasks'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('subtasks followed the parent\'s category', () => {
        const tasks = pm.response.json()
        for (const id of [pm.collectionVariables.get('subChildId'), pm.collectionVariables.get('subGrandchildId')]) {
          pm.expect(tasks.find((t) => t.id === id).category).to.eql(pm.collectionVariables.get('otherCategoryId'))
        }
      })
