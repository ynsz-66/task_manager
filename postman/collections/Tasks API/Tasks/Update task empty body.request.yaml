$kind: http-request
order: 4200
method: PATCH
url: '{{baseUrl}}/tasks/{{taskId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {}
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 nothing to update (title, category, done, parent, position or dueDate)', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('nothing to update (title, category, done, parent, position or dueDate)')
      })
