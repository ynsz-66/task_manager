$kind: http-request
order: 5000
method: DELETE
url: '{{baseUrl}}/tasks'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 only done=true is supported', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('only done=true is supported')
      })
