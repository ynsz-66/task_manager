$kind: http-request
order: 4100
method: PATCH
url: '{{baseUrl}}/tasks/abc'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "done": true }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 invalid id', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('invalid id')
      })
