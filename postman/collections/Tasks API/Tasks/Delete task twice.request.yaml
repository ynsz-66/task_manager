$kind: http-request
order: 6200
method: DELETE
url: '{{baseUrl}}/tasks/{{taskId2}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 task not found', () => {
        pm.response.to.have.status(404)
        pm.expect(pm.response.json().error).to.eql('task not found')
      })
