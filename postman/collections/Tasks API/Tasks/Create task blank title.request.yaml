$kind: http-request
order: 3300
method: POST
url: '{{baseUrl}}/tasks'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "title": "   " }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 title is required', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('title is required')
      })
