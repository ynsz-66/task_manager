$kind: http-request
order: 3600
method: POST
url: '{{baseUrl}}/tasks'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "title": "x", "category": "{{unknownId}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 invalid category', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('invalid category')
      })
