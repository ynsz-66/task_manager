$kind: http-request
order: 3200
method: POST
url: '{{baseUrl}}/categories'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "name": "pmA{{suffix}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('409 duplicate', () => {
        pm.response.to.have.status(409)
        pm.expect(pm.response.json().error).to.eql('category already exists')
      })
