$kind: http-request
order: 6550
method: PATCH
url: '{{baseUrl}}/tasks/{{doneTaskId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "done": true }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('200 task done', () => pm.expect(pm.response.json().done).to.eql(true))
