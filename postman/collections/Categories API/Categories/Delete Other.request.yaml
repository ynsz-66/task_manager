$kind: http-request
order: 7500
method: DELETE
url: '{{baseUrl}}/categories/{{otherId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 Other cannot be deleted', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('Other cannot be deleted')
      })
