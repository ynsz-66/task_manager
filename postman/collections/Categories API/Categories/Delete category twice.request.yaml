$kind: http-request
order: 7400
method: DELETE
url: '{{baseUrl}}/categories/{{catBId}}'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 not found', () => {
        pm.response.to.have.status(404)
        pm.expect(pm.response.json().error).to.eql('category not found')
      })
