$kind: http-request
order: 3500
method: POST
url: '{{baseUrl}}/categories'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "name": "   " }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 blank name', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('name must be 2 to 20 characters')
      })
