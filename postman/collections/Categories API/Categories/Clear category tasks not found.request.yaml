$kind: http-request
order: 6900
method: DELETE
url: '{{baseUrl}}/categories/{{unknownId}}/tasks'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 category not found', () => {
        pm.response.to.have.status(404)
