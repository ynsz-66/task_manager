$kind: http-request
order: 3800
method: POST
url: '{{baseUrl}}/categories'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "name": "pmC{{suffix}}", "order": "1" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 order not a number', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('order must be a number')
      })
