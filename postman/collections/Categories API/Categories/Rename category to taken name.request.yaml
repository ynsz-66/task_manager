$kind: http-request
order: 5200
method: PATCH
url: '{{baseUrl}}/categories/{{catAId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "name": "pmB{{suffix}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('409 name taken', () => {
        pm.response.to.have.status(409)
        pm.expect(pm.response.json().error).to.eql('category already exists')
      })
