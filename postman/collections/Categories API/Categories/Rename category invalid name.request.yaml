$kind: http-request
order: 5900
method: PATCH
url: '{{baseUrl}}/categories/{{catAId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "name": "x" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 invalid name', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('name must be 2 to 20 characters')
      })
