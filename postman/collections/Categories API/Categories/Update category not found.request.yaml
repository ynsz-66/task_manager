$kind: http-request
order: 6300
method: PATCH
url: '{{baseUrl}}/categories/{{unknownId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "name": "pmX{{suffix}}" }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('404 not found', () => {
        pm.response.to.have.status(404)
        pm.expect(pm.response.json().error).to.eql('category not found')
      })
