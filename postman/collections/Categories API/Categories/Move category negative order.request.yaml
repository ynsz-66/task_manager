$kind: http-request
order: 5600
method: PATCH
url: '{{baseUrl}}/categories/{{catAId}}'
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    { "order": -1 }
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('400 negative order', () => {
        pm.response.to.have.status(400)
        pm.expect(pm.response.json().error).to.eql('order must be a non-negative integer')
      })
